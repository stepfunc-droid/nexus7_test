name: Build diskless flo test image

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo dpkg --add-architecture armhf
          sudo apt-get update
          sudo apt-get install -y \
            git make gcc-arm-linux-gnueabihf bc bison flex \
            libssl-dev libelf-dev device-tree-compiler cpio gzip xz-utils \
            python3 mkbootimg

      - name: Fetch static ARM BusyBox
        run: |
          mkdir -p .cache/busybox-armhf
          cd /tmp
          apt-get download busybox-static:armhf
          deb="$(ls -1 busybox-static_*_armhf.deb | head -n1)"
          dpkg-deb -x "$deb" "$GITHUB_WORKSPACE/.cache/busybox-armhf"
          file "$GITHUB_WORKSPACE/.cache/busybox-armhf/bin/busybox"

      - name: Build RAM-only image
        run: |
          chmod +x build.sh scripts/patch-flo-dts.py initramfs/init
          ./build.sh

      - name: Show image metadata
        run: |
          ls -lh out/
          cat out/SHA256SUMS

      - name: Upload test image
        uses: actions/upload-artifact@v4
        with:
          name: nexus7-flo-diskless-test
          path: out/
          if-no-files-found: error
