name: Build diskless flo test image

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git make gcc-arm-linux-gnueabihf bc bison flex \
            libssl-dev libelf-dev device-tree-compiler cpio gzip xz-utils bzip2 wget \
            python3 mkbootimg

      - name: Build RAM-only image
        run: |
          chmod +x build.sh scripts/patch-flo-dts.py initramfs/init
          ./build.sh

      - name: Show image metadata
        run: |
          ls -lh out/
          cat out/SHA256SUMS

      - name: Upload test image
        uses: actions/upload-artifact@v4
        with:
          name: nexus7-flo-diskless-test
          path: out/
          if-no-files-found: error
